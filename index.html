    // ---- تحميل نموذج تتبّع الوجه (MediaPipe) مرة واحدة؛ يرجع null إن تعذّر فيعمل الحساس المبسّط ----
    let faceLandmarkerPromise = null;
    function getFaceLandmarker() {
      if (faceLandmarkerPromise) return faceLandmarkerPromise;
      faceLandmarkerPromise = (async () => {
        try {
          const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
          const mod = await import(base + '/vision_bundle.mjs');
          const fileset = await mod.FilesetResolver.forVisionTasks(base + '/wasm');
          const make = (delegate) =>
            mod.FaceLandmarker.createFromOptions(fileset, {
              baseOptions: {
                modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
                delegate
              },
              outputFaceBlendshapes: true,
              runningMode: 'VIDEO',
              numFaces: 1
            });
          try {
            return await make('GPU');
          } catch (e) {
            return await make('CPU');
          }
        } catch (e) {
          return null;
        }
      })();
      return faceLandmarkerPromise;
    }

    // ===================== ممنوع الضحك (DO NOT LAUGH): بثّ مباشر بين الأجهزة + صوت التسجيل =====================
    function runDonutLaughGame(container, gameObj) {
      const TOTAL = gameObj.duration || 15;
      let timeLeft = TOTAL;
      let finished = false;
      let camStream = null;
      let outStream = null;
      let rafId = null;
      let baselineMouthLuma = null;
      let smileFrames = 0;
      let sensorActive = false;
      let faceLm = null;
      let lmHits = 0;
      let lastRun = 0;
      let micStream = null;
      let micSrcNode = null;
      let micAnalyser = null;
      let micBuf = null;
      let micBaseline = 0;
      let micHits = 0;
      let clipSrc = null;
      let fallbackTimer = null;
      const retryTimers = [];
      const tiles = {};
      const startedAt = Date.now();

      container.innerHTML = `
        <div class="flex-1 flex flex-col space-y-3">
          <div class="bg-[#3d1ca0] border border-[#ffc933]/30 rounded-2xl p-3 flex items-center justify-between">
            <span id="dlWatchLabel" class="text-base font-black text-[#ff5fa2]">جاري تجهيز الكاميرا...</span>
            <span id="dlTimer" class="text-2xl font-black text-white">${timeLeft}ث</span>
          </div>
          <div class="relative flex-1 min-h-[380px] bg-black rounded-3xl overflow-hidden border border-[#ffc933]/30">
            <div id="dlRemoteGrid" class="absolute inset-0" style="display:grid;grid-auto-rows:1fr;gap:2px;grid-template-columns:1fr;"></div>
            <video id="dlSelfVideo" autoplay playsinline muted class="mirror-video" style="position:absolute;bottom:56px;left:10px;width:92px;height:122px;object-fit:cover;border-radius:14px;border:2px solid #ffc933;background:#000;z-index:5;"></video>
            <canvas id="dlFaceSensorCanvas" width="128" height="96" class="hidden"></canvas>
            <div id="dlSensorChip" class="absolute top-3 right-3 px-3 py-1 rounded-full bg-black/60 text-sm font-bold text-white" style="z-index:6">⏳ تجهيز الحساس...</div>
            <button type="button" id="dlSoundBtn" class="hidden absolute top-3 left-3 px-3 py-1.5 rounded-full bg-[#ffc933] text-[#2a0f73] text-sm font-black" style="z-index:6">🔊 اضغط لسماع الصوت</button>
            <div class="absolute bottom-3 inset-x-3 text-center text-xl font-black text-white" style="text-shadow:0 2px 8px #000;z-index:6">😐 لا تضحك ولا تبتسم!</div>
          </div>
        </div>
      `;

      const labelEl = document.getElementById('dlWatchLabel');
      const timerEl = document.getElementById('dlTimer');
      const chipEl = document.getElementById('dlSensorChip');
      const gridEl = document.getElementById('dlRemoteGrid');
      const selfEl = document.getElementById('dlSelfVideo');
      const soundBtn = document.getElementById('dlSoundBtn');
      const canvasEl = document.getElementById('dlFaceSensorCanvas');
      const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
      const vidEl = selfEl;

      function setChip(text) {
        if (chipEl) chipEl.textContent = text;
      }

      soundBtn.addEventListener('click', () => {
        Object.values(tiles).forEach((r) => {
          r.video.muted = false;
          r.video.play().catch(() => {});
        });
        soundBtn.classList.add('hidden');
      });

      function updateLabel() {
        const got = Object.values(tiles).filter((r) => r.got);
        if (got.length) labelEl.textContent = `بتشوف: ${got.map((r) => r.name).join('، ')} 👀`;
      }

      function showOwnLarge(msg) {
        if (Object.values(tiles).some((r) => r.got)) return;
        selfEl.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1;';
        labelEl.textContent = msg;
      }

      function addTile(target) {
        if (tiles[target.id]) return tiles[target.id];
        const wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative;background:#000;overflow:hidden;min-height:0;';
        wrap.innerHTML = `
          <video autoplay playsinline style="width:100%;height:100%;object-fit:cover;"></video>
          <div class="dl-wait" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:800;font-size:16px;background:rgba(42,15,115,.85);padding:8px;">⏳ بانتظار ${escapeHtml(target.name)}...</div>
          <div style="position:absolute;top:8px;right:8px;padding:2px 10px;border-radius:9999px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:800;">${escapeHtml(target.name)}</div>`;
        gridEl.appendChild(wrap);
        const rec = { wrap, video: wrap.querySelector('video'), got: false, name: target.name };
        tiles[target.id] = rec;
        gridEl.style.gridTemplateColumns = Object.keys(tiles).length >= 3 ? '1fr 1fr' : '1fr';
        return rec;
      }

      function connectTo(target, attempt) {
        if (finished || !appState.peer || !outStream) return;
        const rec = addTile(target);
        let call = null;
        try {
          call = appState.peer.call(target.peerId, outStream);
        } catch (e) {
          call = null;
        }
        if (!call) return;
        activeMediaCalls.push(call);
        call.on('stream', (remoteStream) => {
          if (finished || rec.got) return;
          rec.got = true;
          const w = rec.wrap.querySelector('.dl-wait');
          if (w) w.remove();
          rec.video.srcObject = remoteStream;
          rec.video.muted = false;
          const p = rec.video.play();
          if (p && p.catch) {
            p.catch(() => {
              rec.video.muted = true;
              rec.video.play().catch(() => {});
              soundBtn.classList.remove('hidden');
            });
          }
          updateLabel();
        });
        call.on('error', () => {});
        retryTimers.push(
          setTimeout(() => {
            if (finished || rec.got) return;
            try { call.close(); } catch (e) {}
            if (attempt < 3) connectTo(target, attempt + 1);
          }, 4500)
        );
      }

      function startRemote() {
        const targets = pickDonutTargets();
        if (!targets.length || !appState.peer) {
          showOwnLarge('ما في غيرك بالغرفة — هاي كاميرتك 😄');
          return;
        }
        labelEl.textContent = 'جاري الاتصال بأصدقائك...';
        targets.forEach((t) => connectTo(t, 1));
        fallbackTimer = setTimeout(() => showOwnLarge('ما وصل البث — هاي كاميرتك'), 12000);
      }

      // تسجيلك الصوتي من لعبة «سباق القراءة» يُرسل مع بثّك ليسمعه أصدقاؤك على أجهزتهم (بدون أي رفع للسيرفر)
      async function attachClipAudio(out) {
        const clip = pickMyVoiceClip();
        if (!clip || !clip.dataUrl) return;
        try {
          const actx = getStreamAudioCtx();
          if (!actx) return;
          const buf = await decodeAudioCompat(actx, dataUrlToArrayBuffer(clip.dataUrl));
          if (finished) return;
          const dest = actx.createMediaStreamDestination();
          clipSrc = actx.createBufferSource();
          clipSrc.buffer = buf;
          clipSrc.loop = true;
          clipSrc.connect(dest);
          clipSrc.start();
          dest.stream.getAudioTracks().forEach((t) => out.addTrack(t));
        } catch (e) {}
      }

      function triggerCaughtLaughing(reasonText) {
        if (finished) return;
        finished = true;
        playSoundCue('fail');
        const sec = Math.min(TOTAL, (Date.now() - startedAt) / 1000);
        showTopBanner(`${reasonText} — خسرت!`, 'important');
        setTimeout(() => {
          submitPlayerGameResult(Math.round(sec * 10), `صمد ${sec.toFixed(1)} ثانية قبل ما يضحك`);
        }, 700);
      }

      function triggerSurvivedFullRound() {
        if (finished) return;
        finished = true;
        if (!sensorActive) {
          submitPlayerGameResult(5, 'الحساس معطّل (الكاميرا غير مفعّلة)');
          return;
        }
        playSoundCue('win');
        showTopBanner(`وحش! صمدت ${TOTAL} ثانية وما ضحكت!`, 'important');
        submitPlayerGameResult(TOTAL * 10 + 50, `صمد ${TOTAL} ثانية كاملة بدون ضحك 🏆`);
      }

      const iv = setInterval(() => {
        if (finished) return;
        timeLeft--;
        if (timerEl) timerEl.textContent = `${Math.max(0, timeLeft)}ث`;
        if (timeLeft <= 0) {
          clearInterval(iv);
          triggerSurvivedFullRound();
        }
      }, 1000);

      // حساس الصوت: يلتقط القهقهة العالية المفاجئة
      function startMicSensor(ms) {
        try {
          const actx = getStreamAudioCtx();
          if (!actx) return;
          micStream = ms;
          micAnalyser = actx.createAnalyser();
          micAnalyser.fftSize = 1024;
          micSrcNode = actx.createMediaStreamSource(ms);
          micSrcNode.connect(micAnalyser);
          micBuf = new Uint8Array(micAnalyser.fftSize);
        } catch (e) {}
      }

      function pollMic() {
        if (!micAnalyser) return false;
        micAnalyser.getByteTimeDomainData(micBuf);
        let sum = 0;
        for (let i = 0; i < micBuf.length; i++) {
          const v = (micBuf[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / micBuf.length);
        const elapsed = Date.now() - startedAt;
        if (elapsed < 2500) {
          micBaseline = Math.max(micBaseline, rms);
          return false;
        }
        if (rms > Math.max(0.18, micBaseline * 2.8)) micHits++;
        else micHits = Math.max(0, micHits - 1);
        return micHits >= 6;
      }

      function heuristicMouthCheck() {
        ctx.drawImage(vidEl, 0, 0, canvasEl.width, canvasEl.height);
        const d = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height).data;
        let mouthSum = 0;
        let mouthCnt = 0;
        for (let y = 56; y < 82; y++) {
          for (let x = 34; x < 94; x++) {
            const idx = (y * canvasEl.width + x) * 4;
            mouthSum += (d[idx] + d[idx + 1] + d[idx + 2]) / 3;
            mouthCnt++;
          }
        }
        const avgMouth = mouthCnt ? mouthSum / mouthCnt : 0;
        if (baselineMouthLuma === null) {
          baselineMouthLuma = avgMouth;
          return false;
        }
        if (Date.now() - startedAt < 1200) {
          baselineMouthLuma = baselineMouthLuma * 0.7 + avgMouth * 0.3;
          return false;
        }
        const delta = Math.abs(avgMouth - baselineMouthLuma);
        const threshold = Math.max(2.6, baselineMouthLuma * 0.035);
        if (delta > threshold) {
          smileFrames++;
        } else {
          smileFrames = 0;
          baselineMouthLuma = baselineMouthLuma * 0.96 + avgMouth * 0.04;
        }
        return smileFrames >= 4;
      }

      function landmarkCheck() {
        const res = faceLm.detectForVideo(vidEl, performance.now());
        const cats = res && res.faceBlendshapes && res.faceBlendshapes[0] && res.faceBlendshapes[0].categories;
        if (!cats) {
          lmHits = 0;
          return false;
        }
        const g = (n) => {
          const c = cats.find((x) => x.categoryName === n);
          return c ? c.score : 0;
        };
        const smile = (g('mouthSmileLeft') + g('mouthSmileRight')) / 2;
        const open = g('jawOpen');
        const laughing = smile > 0.4 || (smile > 0.22 && open > 0.3) || open > 0.65;
        lmHits = laughing ? lmHits + 1 : 0;
        return lmHits >= 3;
      }

      function sensorLoop() {
        if (finished) return;
        const now = performance.now();
        if (vidEl.readyState >= 2 && now - lastRun > 60) {
          lastRun = now;
          let caught = false;
          let reason = '';
          if (faceLm) {
            try {
              caught = landmarkCheck();
              reason = 'الحساس لقط ابتسامتك!';
            } catch (e) {
              faceLm = null;
              setChip('📷 حساس الكاميرا (مبسّط)');
            }
          } else {
            caught = heuristicMouthCheck();
            reason = 'الحساس لقطك عم تضحك أو تبتسم!';
          }
          if (!caught && pollMic()) {
            caught = true;
            reason = 'الحساس سمع ضحكتك!';
          }
          if (caught) {
            triggerCaughtLaughing(reason);
            return;
          }
          captureSilentGameSnapshot(vidEl, gameObj);
        }
        rafId = requestAnimationFrame(sensorLoop);
      }

      async function startAll() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          labelEl.textContent = 'الكاميرا غير متاحة — افتح الرابط عبر https';
          setChip('⛔ الحساس معطّل');
          return;
        }
        getFaceLandmarker().then((lm) => {
          if (finished || !lm) return;
          faceLm = lm;
          setChip('🤖 حساس الابتسامة الذكي شغّال');
        });

        let stream = null;
        try {
          stream = await gumSafe({
            video: { facingMode: 'user' },
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
          });
        } catch (e) {
          try {
            stream = await gumSafe({ video: { facingMode: 'user' }, audio: false });
          } catch (e2) {
            stream = null;
          }
        }
        if (finished) {
          if (stream) stream.getTracks().forEach((t) => t.stop());
          return;
        }
        if (!stream) {
          labelEl.textContent = 'الحساس معطّل — اضغط «إعطاء الأذونات» من الشاشة الرئيسية';
          setChip('⛔ الحساس معطّل');
          return;
        }

        camStream = stream;
        sensorActive = true;
        const vTracks = stream.getVideoTracks();
        const aTracks = stream.getAudioTracks();
        selfEl.srcObject = new MediaStream(vTracks);
        selfEl.play().catch(() => {});
        setChip(faceLm ? '🤖 حساس الابتسامة الذكي شغّال' : '📷 حساس الكاميرا شغّال');

        // بثّ الفيديو فقط + صوت تسجيلك المضحك (لا يُرسل صوت المايك الحي)
        outStream = new MediaStream(vTracks);
        await attachClipAudio(outStream);
        if (finished) return;
        setDonutLocalStream(outStream);

        if (aTracks.length) startMicSensor(new MediaStream(aTracks));
        startRemote();
        rafId = requestAnimationFrame(sensorLoop);
      }
      startAll();

      appState.activeCleanup = () => {
        finished = true;
        clearInterval(iv);
        clearTimeout(fallbackTimer);
        retryTimers.forEach((t) => clearTimeout(t));
        if (rafId) cancelAnimationFrame(rafId);
        try { if (clipSrc) clipSrc.stop(); } catch (e) {}
        try { if (micSrcNode) micSrcNode.disconnect(); } catch (e) {}
        if (micStream) micStream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} });
        if (!appState.room && camStream) camStream.getTracks().forEach((t) => t.stop());
      };
    }

    // ===================== سباق القراءة: المايك يفتح لحاله، والأسرع بقراءة العبارة بياخد أعلى نقاط =====================
    function runVoiceRecordingGame(container, gameObj) {
      const phrase = VOICE_PHRASES[Math.floor(Math.random() * VOICE_PHRASES.length)];
      const MAX_MS = 25000;
      const MIN_VOICED_MS = 1500;
      let phase = 'OPENING'; // OPENING | READING | FINISHING | DONE
      let micStream = null;
      let mediaRecorder = null;
      let chunks = [];
      let micSrcNode = null;
      let analyser = null;
      let buf = null;
      let rafId = null;
      let timerIv = null;
      let manualMode = false;
      let startedAt = 0;
      let lastTick = 0;
      let voicedMs = 0;
      let lastVoiceAt = 0;
      let floor = null;

      container.innerHTML = `
        <div class="flex-1 flex flex-col space-y-3 text-center">
          <div class="bg-[#3d1ca0] border border-[#ffc933]/25 rounded-2xl p-3 flex items-center justify-between">
            <span class="text-base font-black text-[#ff5fa2]">🎙️ سباق القراءة</span>
            <span id="vrTimer" class="text-2xl font-black text-white">0.0ث</span>
          </div>

          <div class="flex-1 flex flex-col justify-center space-y-4">
            <div id="vrStatus" class="text-xl font-extrabold text-[#ffc933]">جاري فتح التسجيل...</div>
            <div id="vrPhraseBox" class="text-3xl font-black text-[#ff5fa2] bg-[#3d1ca0] border-2 border-[#ffc933]/40 rounded-3xl p-6 leading-relaxed" style="opacity:.15;transition:opacity .25s;">
              ${escapeHtml(phrase)}
            </div>
            <div class="h-4 rounded-full bg-[#2a0f73] border border-[#ffc933]/30 overflow-hidden">
              <div id="vrLevel" style="height:100%;width:0%;background:#3ee0ff;transition:width .08s;"></div>
            </div>
          </div>

          <button type="button" id="vrRetryBtn" class="hidden ov-btn">🎙️ اسمح بالميكروفون وحاول</button>
          <button type="button" id="vrDoneBtn" class="ov-btn alt" disabled style="opacity:.5">✅ خلّصت القراءة</button>
        </div>
      `;

      const statusEl = document.getElementById('vrStatus');
      const phraseBox = document.getElementById('vrPhraseBox');
      const timerEl = document.getElementById('vrTimer');
      const levelEl = document.getElementById('vrLevel');
      const retryBtn = document.getElementById('vrRetryBtn');
      const doneBtn = document.getElementById('vrDoneBtn');

      function setDoneEnabled(on) {
        doneBtn.disabled = !on;
        doneBtn.style.opacity = on ? '1' : '.5';
      }

      function stopMic() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        try { if (micSrcNode) micSrcNode.disconnect(); } catch (e) {}
        micSrcNode = null;
        if (micStream) micStream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} });
        micStream = null;
      }

      function saveClipFromChunks(mime) {
        if (!chunks.length) return;
        const blob = new Blob(chunks, { type: mime || 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') {
            saveVoiceClipToStorage({
              id: 'clip_' + Date.now(),
              playerId: appState.profile.id,
              playerName: appState.profile.name,
              phrase,
              dataUrl: reader.result,
              createdAt: Date.now()
            });
          }
        };
        reader.readAsDataURL(blob);
      }

      function finish() {
        if (phase !== 'READING') return;
        phase = 'FINISHING';
        const now = performance.now();
        let readMs;
        if (manualMode || voicedMs < 600) readMs = now - startedAt + 3000;
        else readMs = Math.max(300, lastVoiceAt - startedAt);
        if (timerIv) clearInterval(timerIv);
        try {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        } catch (e) {}
        stopMic();
        setDoneEnabled(false);
        statusEl.textContent = 'تمام! 👏 جاري تسجيل وقتك...';
        timerEl.textContent = (readMs / 1000).toFixed(1) + 'ث';
        playSoundCue('success');
        setTimeout(() => {
          if (phase === 'DONE') return;
          phase = 'DONE';
          const sec = readMs / 1000;
          // الأسرع = رقم أعلى
          submitPlayerGameResult(Math.max(1, 600000 - Math.round(readMs)), `قرأ العبارة بـ ${sec.toFixed(1)} ثانية`);
        }, 700);
      }

      function loop() {
        if (phase !== 'READING') return;
        const now = performance.now();
        if (analyser && now - lastTick >= 40) {
          const dt = now - lastTick;
          lastTick = now;
          analyser.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) {
            const v = (buf[i] - 128) / 128;
            sum += v * v;
          }
          const rms = Math.sqrt(sum / buf.length);
          if (now - startedAt < 450) floor = floor === null ? rms : Math.min(floor, rms);
          const thr = Math.max(0.03, (floor || 0) * 3);
          const speaking = rms > thr;
          if (speaking) {
            voicedMs += dt;
            lastVoiceAt = now;
          }
          levelEl.style.width = Math.min(100, Math.round(rms * 400)) + '%';
          if (voicedMs >= MIN_VOICED_MS) setDoneEnabled(true);
          if (voicedMs >= MIN_VOICED_MS && now - lastVoiceAt > 1400) {
            finish();
            return;
          }
        }
        if (now - startedAt > MAX_MS) {
          finish();
          return;
        }
        rafId = requestAnimationFrame(loop);
      }

      function beginReading() {
        phase = 'READING';
        retryBtn.classList.add('hidden');
        phraseBox.style.opacity = '1';
        statusEl.textContent = 'اقرأ العبارة بصوت عالي هلأ! 🎤';
        playSoundCue('start');
        startedAt = performance.now();
        lastTick = startedAt;

        timerIv = setInterval(() => {
          if (phase !== 'READING') return;
          timerEl.textContent = ((performance.now() - startedAt) / 1000).toFixed(1) + 'ث';
        }, 100);

        if (manualMode || !micStream) {
          manualMode = true;
          setDoneEnabled(true);
          doneBtn.textContent = '✅ خلّصت (بدون مايك: +3 ثواني)';
          rafId = null;
          return;
        }

        try {
          const mime = pickRecorderMime();
          try {
            mediaRecorder = mime ? new MediaRecorder(micStream, { mimeType: mime, audioBitsPerSecond: 32000 }) : new MediaRecorder(micStream);
          } catch (e) {
            mediaRecorder = new MediaRecorder(micStream);
          }
          chunks = [];
          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) chunks.push(ev.data);
          };
          const usedMime = mediaRecorder.mimeType || mime;
          mediaRecorder.onstop = () => saveClipFromChunks(usedMime);
          mediaRecorder.start();
        } catch (e) {
          mediaRecorder = null;
        }

        try {
          const actx = getStreamAudioCtx();
          analyser = actx.createAnalyser();
          analyser.fftSize = 1024;
          micSrcNode = actx.createMediaStreamSource(micStream);
          micSrcNode.connect(analyser);
          buf = new Uint8Array(analyser.fftSize);
        } catch (e) {
          analyser = null;
          manualMode = true;
          setDoneEnabled(true);
        }
        rafId = requestAnimationFrame(loop);
      }

      function showMicFailed() {
        statusEl.textContent = 'ما قدرنا نفتح المايك 🎙️';
        retryBtn.classList.remove('hidden');
        setDoneEnabled(true);
        doneBtn.textContent = 'كمّل بدون مايك (+3 ثواني)';
      }

      async function openMic() {
        statusEl.textContent = 'جاري فتح التسجيل...';
        let ms = null;
        try {
          ms = await gumSafe({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
        } catch (e) {
          ms = null;
        }
        if (phase === 'DONE' || phase === 'FINISHING') {
          if (ms) ms.getTracks().forEach((t) => t.stop());
          return;
        }
        if (!ms) {
          showMicFailed();
          return;
        }
        micStream = ms;
        beginReading();
      }

      retryBtn.addEventListener('click', () => {
        playSoundCue('click');
        if (phase === 'OPENING') openMic();
      });

      doneBtn.addEventListener('click', () => {
        if (phase === 'OPENING') {
          // متابعة بدون مايك
          manualMode = true;
          micStream = null;
          beginReading();
          return;
        }
        if (phase !== 'READING') return;
        if (!manualMode && voicedMs < MIN_VOICED_MS) {
          showTopBanner('اقرأ العبارة بصوت عالٍ أولاً!', 'important');
          return;
        }
        finish();
      });

      openMic();

      appState.activeCleanup = () => {
        phase = 'DONE';
        if (timerIv) clearInterval(timerIv);
        try {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        } catch (e) {}
        stopMic();
      };
    }

    function runBlowBalloonGame(container, gameObj) {
      let left = gameObj.duration || 16;
      let scale = 1.0;
      let popped = false;
      let micStream = null;
      let audioCtx = null;
      let rafId = null;

      container.innerHTML = `
        <div class="flex-1 flex flex-col justify-between space-y-4 text-center">
          <div class="bg-[#3d1ca0] border border-[#ffc933]/25 rounded-2xl p-3 flex items-center justify-between">
            <span class="text-sm font-black text-[#ff5fa2]">${escapeHtml(gameObj.name)}</span>
            <span id="balloonTimer" class="text-base font-black text-white">${left}ث</span>
          </div>

          <div class="flex-1 min-h-[260px] bg-[#3d1ca0] border border-[#ffc933]/30 rounded-3xl flex flex-col items-center justify-center relative overflow-hidden p-4">
            <div id="balloonOrb" style="transform: scale(${scale});" class="w-24 h-28 rounded-full bg-gradient-to-b from-rose-400 via-rose-500 to-rose-700 shadow-2xl transition-transform duration-100 flex items-center justify-center text-3xl">
              🎈
            </div>
            <div id="balloonBoomBanner" class="hidden text-3xl font-black text-[#ff5fa2] anim-pop">💥 انفجر البالون!</div>
          </div>

          <div class="bg-[#3d1ca0] border border-[#ffc933]/25 rounded-2xl p-3 space-y-2">
            <div class="flex items-center justify-between text-sm font-bold">
              <span class="text-slate-300">مستوى النفخ في المايك:</span>
              <span id="micLevelPct" class="text-[#ffc933]">0%</span>
            </div>
            <div class="w-full h-3 rounded-full bg-[#2a0f73] overflow-hidden">
              <div id="micLevelBar" class="h-full w-0 bg-[#ffc933] transition-all duration-100"></div>
            </div>
            <p id="micStatusText" class="text-sm text-slate-400">انفخ في المايكروفون لتكبير البالون حتى ينفجر</p>
            <button type="button" id="tapBlowBtn" class="hidden w-full py-3 rounded-2xl bg-[#ff5fa2] text-[#2a0f73] font-black text-lg">🎈 اضغط للنفخ</button>
          </div>
        </div>
      `;

      const timerEl = document.getElementById('balloonTimer');
      const orbEl = document.getElementById('balloonOrb');
      const boomEl = document.getElementById('balloonBoomBanner');
      const pctEl = document.getElementById('micLevelPct');
      const barEl = document.getElementById('micLevelBar');
      const statusEl = document.getElementById('micStatusText');

      function applyBlowDelta(delta) {
        if (popped) return;
        scale = Math.min(3.2, scale + delta);
        if (orbEl) orbEl.style.transform = `scale(${scale.toFixed(2)})`;
        if (scale >= 3.15) {
          popped = true;
          playSoundCue('win');
          if (orbEl) orbEl.classList.add('hidden');
          if (boomEl) boomEl.classList.remove('hidden');
          setTimeout(() => {
            submitPlayerGameResult(100 + left * 5, `فجّر البالون خلال ${Math.max(1, (gameObj.duration || 16) - left)}ث`);
          }, 900);
        }
      }

      const countdownIv = setInterval(() => {
        if (popped) return;
        left--;
        if (timerEl) timerEl.textContent = `${Math.max(0, left)}ث`;
        if (left <= 0) {
          popped = true;
          clearInterval(countdownIv);
          submitPlayerGameResult(Math.round((scale - 1) * 35), `حجم البالون: ${Math.round(scale * 100)}%`);
        }
      }, 1000);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ audio: true, video: false })
          .then((stream) => {
            if (popped) {
              stream.getTracks().forEach((t) => t.stop());
              return;
            }
            micStream = stream;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            audioCtx = new Ctx();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            const src = audioCtx.createMediaStreamSource(stream);
            src.connect(analyser);
            const dataArr = new Uint8Array(analyser.frequencyBinCount);

            const pollMic = () => {
              if (popped) return;
              analyser.getByteFrequencyData(dataArr);
              let sum = 0;
              for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
              const avg = sum / dataArr.length;
              const pct = Math.min(100, Math.round((avg / 110) * 100));
              if (pctEl) pctEl.textContent = `${pct}%`;
              if (barEl) barEl.style.width = `${pct}%`;
              if (pct >= 28) {
                if (statusEl) statusEl.textContent = 'نفخ ممتاز! استمر حتى ينفجر';
                applyBlowDelta(0.025 + (pct - 28) * 0.0008);
              }
              rafId = requestAnimationFrame(pollMic);
            };
            rafId = requestAnimationFrame(pollMic);
          })
          .catch(() => {
            if (statusEl) statusEl.textContent = 'تعذّر الوصول للمايكروفون — استخدم زر النفخ بالضغط';
            const tb = document.getElementById('tapBlowBtn');
            if (tb) {
              tb.classList.remove('hidden');
              tb.addEventListener('click', () => {
                playSoundCue('click');
                applyBlowDelta(0.09);
              });
            }
          });
      }

      appState.activeCleanup = () => {
        popped = true;
        clearInterval(countdownIv);
        if (rafId) cancelAnimationFrame(rafId);
        if (audioCtx) audioCtx.close().catch(() => {});
        if (micStream) micStream.getTracks().forEach((t) => t.stop());
      };
    }

    function runStayInCircleGame(container, gameObj) {
      const PLAY_SECONDS = 12;
      const AW = 150; // أبعاد التحليل بنسبة 3:4 مطابقة للإطار المعروض
      const AH = 200;
      let phase = 'CALIBRATE'; // CALIBRATE → COUNT → PLAYING → REVEAL
      let finished = false;
      let stream = null;
      let timeLeft = PLAY_SECONDS;
      let secIv = null;
      let countIv = null;
      let autoTimer = null;
      let circle = { x: 50, y: 50, d: 26 }; // x,y بالنسبة المئوية من الإطار، d قطر الدائرة كنسبة من العرض
      let faceDetector = null;
      let finalScore = 0;
      let finalMetric = '';
      let camFailed = false;

      container.innerHTML = `
        <div class="flex-1 flex flex-col space-y-3 items-center">
          <div class="w-full bg-[#3d1ca0] border border-[#ffc933]/25 rounded-2xl p-3 flex items-center justify-between">
            <span class="text-base font-black text-[#ff5fa2]">${escapeHtml(gameObj.arTitle || gameObj.name)}</span>
            <span id="circleTimer" class="text-xl font-black text-white">جاهز؟</span>
          </div>

          <p id="circleHint" class="text-base text-center text-slate-200 font-bold">
            ضع رأسك داخل الإطار الخطي ثم اضغط «جاهز» — بعدها بتسود الشاشة!
          </p>

          <div id="circleBox" class="relative w-full rounded-3xl overflow-hidden border-2 border-[#ffc933]/40 bg-black" style="max-width:300px;aspect-ratio:3/4;">
            <video id="circleVideo" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover mirror-video"></video>
            <div id="circleGuide" class="pointer-events-none absolute inset-0 flex items-center justify-center">
              <div class="w-32 h-44 rounded-full border-4 border-dashed border-[#ff5fa2]/80"></div>
            </div>
            <div id="circleCount" class="hidden pointer-events-none absolute inset-0 flex items-center justify-center display text-9xl text-[#ff5fa2]" style="text-shadow:0 4px 18px #000"></div>
            <div id="circleBlackout" class="hidden absolute inset-0 bg-black">
              <div id="circleTarget" class="absolute rounded-full border-4 border-[#ffc933] bg-[#ffc933]/15 flex items-center justify-center" style="transform:translate(-50%,-50%);">
                <span class="text-base font-extrabold text-[#ffc933]">رأسك هنا؟</span>
              </div>
            </div>
            <canvas id="circleReveal" width="300" height="400" class="hidden absolute inset-0 w-full h-full"></canvas>
          </div>

          <div id="circleResult" class="hidden w-full max-w-[300px] text-center bg-[#3d1ca0] border border-[#ff5fa2]/40 rounded-2xl p-3 space-y-1"></div>

          <button type="button" id="circleReadyBtn" class="w-full max-w-[300px] py-3.5 rounded-2xl bg-[#ffc933] hover:bg-[#ffd75e] text-[#2a0f73] font-black text-xl">✓ جاهز</button>
          <button type="button" id="circleConfirmBtn" class="hidden w-full max-w-[300px] py-3.5 rounded-2xl bg-[#ff5fa2] text-[#2a0f73] font-black text-xl">📍 هذا مكان رأسي — تأكيد</button>
          <button type="button" id="circleDoneBtn" class="hidden w-full max-w-[300px] py-3.5 rounded-2xl bg-[#ffc933] text-[#2a0f73] font-black text-xl">متابعة ▶</button>
        </div>
      `;

      const timerEl = document.getElementById('circleTimer');
      const hintEl = document.getElementById('circleHint');
      const vidEl = document.getElementById('circleVideo');
      const guideEl = document.getElementById('circleGuide');
      const countEl = document.getElementById('circleCount');
      const blackEl = document.getElementById('circleBlackout');
      const targetEl = document.getElementById('circleTarget');
      const revealCanvas = document.getElementById('circleReveal');
      const resultEl = document.getElementById('circleResult');
      const readyBtn = document.getElementById('circleReadyBtn');
      const confirmBtn = document.getElementById('circleConfirmBtn');
      const doneBtn = document.getElementById('circleDoneBtn');

      const anaCanvas = document.createElement('canvas');
      anaCanvas.width = AW;
      anaCanvas.height = AH;
      const actx = anaCanvas.getContext('2d', { willReadFrequently: true });

      function drawCover(ctx, W, H) {
        const vw = vidEl.videoWidth;
        const vh = vidEl.videoHeight;
        const s = Math.max(W / vw, H / vh);
        const dw = vw * s;
        const dh = vh * s;
        ctx.save();
        ctx.translate(W, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(vidEl, (W - dw) / 2, (H - dh) / 2, dw, dh);
        ctx.restore();
      }

      // تحديد مركز الرأس: FaceDetector إن وُجد، وإلا تحليل لون البشرة
      async function locateHead() {
        drawCover(actx, AW, AH);
        if ('FaceDetector' in window) {
          try {
            faceDetector = faceDetector || new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
            const faces = await faceDetector.detect(anaCanvas);
            if (faces && faces.length) {
              const b = faces[0].boundingBox;
              return { x: ((b.x + b.width / 2) / AW) * 100, y: ((b.y + b.height / 2) / AH) * 100 };
            }
          } catch (e) {}
        }
        const data = actx.getImageData(0, 0, AW, AH).data;
        const pts = [];
        for (let y = 0; y < AH; y += 2) {
          for (let x = 0; x < AW; x += 2) {
            const i = (y * AW + x) * 4;
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const Y = 0.299 * r + 0.587 * g + 0.114 * b;
            const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
            const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
            if (Y > 40 && cb > 77 && cb < 127 && cr > 133 && cr < 173) pts.push([x, y]);
          }
        }
        if (pts.length < (AW * AH) / 4 * 0.012) return null;
        let cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
        let cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
        for (let pass = 0; pass < 2; pass++) {
          const sd = Math.sqrt(pts.reduce((a, p) => a + (p[0] - cx) ** 2 + (p[1] - cy) ** 2, 0) / pts.length) || 1;
          const keep = pts.filter((p) => Math.hypot(p[0] - cx, p[1] - cy) <= sd * 1.8);
          if (keep.length < 8) break;
          cx = keep.reduce((a, p) => a + p[0], 0) / keep.length;
          cy = keep.reduce((a, p) => a + p[1], 0) / keep.length;
        }
        return { x: (cx / AW) * 100, y: (cy / AH) * 100 };
      }

      function placeCircle() {
        const d = 24 + Math.random() * 8; // % من العرض
        const rx = d / 2;
        const ry = (d * 0.75) / 2; // الإطار 3:4 فارتفاع الدائرة بالنسبة لارتفاع الإطار أقل
        circle = {
          d,
          x: rx + 6 + Math.random() * (100 - 2 * (rx + 6)),
          y: ry + 6 + Math.random() * (100 - 2 * (ry + 6))
        };
        targetEl.style.left = circle.x.toFixed(1) + '%';
        targetEl.style.top = circle.y.toFixed(1) + '%';
        targetEl.style.width = circle.d.toFixed(1) + '%';
        targetEl.style.aspectRatio = '1 / 1';
      }

      function startCountdown() {
        if (finished || phase !== 'CALIBRATE' || camFailed) return;
        if (!stream) {
          showTopBanner('انتظر لحظة حتى تشتغل الكاميرا', 'important');
          return;
        }
        phase = 'COUNT';
        playSoundCue('start');
        readyBtn.classList.add('hidden');
        guideEl.classList.add('hidden');
        hintEl.textContent = 'ثبّت وضعك... بتسود الشاشة بعد العد!';
        countEl.classList.remove('hidden');
        let n = 3;
        countEl.textContent = String(n);
        countIv = setInterval(() => {
          n--;
          if (n >= 1) {
            playSoundCue('click');
            countEl.textContent = String(n);
          } else {
            clearInterval(countIv);
            countIv = null;
            countEl.classList.add('hidden');
            startBlackout();
          }
        }, 900);
      }

      function startBlackout() {
        if (finished) return;
        phase = 'PLAYING';
        placeCircle();
        blackEl.classList.remove('hidden');
        confirmBtn.classList.remove('hidden');
        hintEl.textContent = 'الشاشة سوداء! حرّك رأسك لتخمّن مكانه داخل الدائرة ثم اضغط تأكيد';
        timerEl.textContent = timeLeft + 'ث';
        playSoundCue('freeze');
        secIv = setInterval(() => {
          if (finished || phase !== 'PLAYING') return;
          timeLeft--;
          timerEl.textContent = Math.max(0, timeLeft) + 'ث';
          if (timeLeft <= 0) confirmPosition();
        }, 1000);
      }

      async function confirmPosition() {
        if (finished || phase !== 'PLAYING') return;
        phase = 'REVEAL';
        clearInterval(secIv);
        confirmBtn.classList.add('hidden');
        timerEl.textContent = '...';

        const W = revealCanvas.width;
        const H = revealCanvas.height;
        const rctx = revealCanvas.getContext('2d');
        let head = null;
        if (vidEl.videoWidth) {
          drawCover(rctx, W, H); // لقطة لحظة التأكيد
          head = await locateHead();
          captureSilentGameSnapshot(vidEl, gameObj);
        }
        blackEl.classList.add('hidden');
        revealCanvas.classList.remove('hidden');

        const cxp = (circle.x / 100) * W;
        const cyp = (circle.y / 100) * H;
        const rp = ((circle.d / 100) * W) / 2;
        rctx.lineWidth = 5;
        rctx.strokeStyle = '#ff5fa2';
        rctx.beginPath();
        rctx.arc(cxp, cyp, rp, 0, Math.PI * 2);
        rctx.stroke();

        let msg;
        if (head) {
          const hx = (head.x / 100) * W;
          const hy = (head.y / 100) * H;
          rctx.strokeStyle = '#ff5a5f';
          rctx.fillStyle = '#ff5a5f';
          rctx.lineWidth = 3;
          rctx.beginPath();
          rctx.moveTo(cxp, cyp);
          rctx.lineTo(hx, hy);
          rctx.stroke();
          rctx.beginPath();
          rctx.arc(hx, hy, 9, 0, Math.PI * 2);
          rctx.fill();

          const dist = Math.hypot(hx - cxp, hy - cyp);
          if (dist <= rp) {
            finalScore = Math.round(100 - (dist / rp) * 30);
            msg = `🎯 رأسك داخل الدائرة! (${finalScore} نقطة)`;
          } else {
            const outside = (dist - rp) / W;
            finalScore = Math.max(0, Math.round(70 - outside * 160));
            msg = `خارج الدائرة بمقدار ${Math.round(outside * 100)}% من العرض (${finalScore} نقطة)`;
          }
          finalMetric = `بُعد عن الهدف: ${Math.round((dist / W) * 100)}% — ${finalScore} نقطة`;
          playSoundCue(dist <= rp ? 'win' : 'fail');
        } else {
          finalScore = 10;

    function runDotMemoryGame(container, gameObj) {
      const totalSubRounds = 3;

            </div>

        hideTimer = setTimeout(() => {
          if (answerRevealed || gameDone) return;
          const dotsLayer = document.getElementById('dotsLayer');
          const hiddenMsg = document.getElementById('dotsHiddenMsg');
          const formEl = document.getElementById('dotGuessForm');
          if (dotsLayer) dotsLayer.classList.add('hidden');
          if (hiddenMsg) hiddenMsg.classList.remove('hidden');
          if (formEl) formEl.classList.remove('hidden');
        }, 1250);

        const confirmBtn = document.getElementById('dotConfirmBtn');
        if (confirmBtn) {
          confirmBtn.addEventListener('click', () => {
            if (answerRevealed || gameDone) return;
            answerRevealed = true;
            const rawVal = parseInt(document.getElementById('dotGuessInput').value, 10);

            const diff = Math.abs(guess - actualDots);

            totalScore += roundPts;
            playSoundCue(diff <= 2 ? 'success' : 'click');

            const formEl = document.getElementById('dotGuessForm');

    function runTapFrenzyGame(container, gameObj) {
      let left = gameObj.duration || 12;
      let tapsCount = 0;
      let peakSimultaneousFingers = 0;
      let finished = false;

      container.innerHTML = `
        <div class="flex-1 flex flex-col space-y-3">
          <div class="bg-[#3d1ca0] border border-[#ffc933]/25 rounded-2xl p-3 flex items-center justify-between">

          </div>

          <div id="fullScreenTapPad" class="flex-1 min-h-[300px] bg-[#3d1ca0] border-2 border-[#ffc933]/40 rounded-3xl p-5 flex flex-col items-center justify-center text-center space-y-2 touch-none relative overflow-hidden">
            <div class="text-sm font-bold text-[#ffc933]">كبّس في أي مكان على الشاشة بأكثر من إصبع معاً</div>
            <div id="tapCounterBig" class="text-5xl font-black text-white">0</div>
            <div id="fingerCountHint" class="text-sm font-bold text-[#ff5fa2]">أقصى أصابع متزامنة: 0</div>
          </div>
        </div>
      `;

      const pad = document.getElementById('fullScreenTapPad');
      const counterEl = document.getElementById('tapCounterBig');
      const fingerHint = document.getElementById('fingerCountHint');
      const timerEl = document.getElementById('tapTimerEl');

      function registerTapBurst(newTaps, concurrent) {
        if (finished) return;
        const fingers = Math.max(1, concurrent || 1);
        if (fingers > peakSimultaneousFingers) peakSimultaneousFingers = fingers;
        tapsCount += Math.max(1, newTaps || 1);
        playSoundCue('click');
        if (counterEl) counterEl.textContent = String(tapsCount);
        if (fingerHint) fingerHint.textContent = `أقصى أصابع متزامنة: ${peakSimultaneousFingers}`;
      }

      const onTouchStart = (e) => {
        if (finished) return;
        e.preventDefault();
        registerTapBurst(e.changedTouches ? e.changedTouches.length : 1, e.touches ? e.touches.length : 1);
      };

      const onMouseDown = (e) => {
        if (finished) return;
        if (e.buttons > 0) registerTapBurst(1, 1);
      };

      pad.addEventListener('touchstart', onTouchStart, { passive: false });
      pad.addEventListener('mousedown', onMouseDown);

      const iv = setInterval(() => {
        if (finished) return;
        left--;
        if (timerEl) timerEl.textContent = `${Math.max(0, left)}ث`;
        if (left <= 0) {
          finished = true;
          clearInterval(iv);
          submitPlayerGameResult(tapsCount, `${tapsCount} كبسة (أقصى أصابع: ${peakSimultaneousFingers})`);
        }
      }, 1000);

      appState.activeCleanup = () => {
        finished = true;
        clearInterval(iv);
        pad.removeEventListener('touchstart', onTouchStart);
        pad.removeEventListener('mousedown', onMouseDown);
      };
    }

          finished = true;
          clearInterval(timerIv);
          submitPlayerGameResult(matchedCount * 20, `إيموجيات متطابقة: ${matchedCount}`);
        }
      }, 1000);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {

          .then((s) => {
            if (finished) {
              s.getTracks().forEach((t) => t.stop());
              return;
            }
            stream = s;
            vidEl.srcObject = s;
            const analyzeExpressionChange = () => {
              if (finished) return;
              if (vidEl.readyState >= 2) {
                ctx.drawImage(vidEl, 0, 0, canvasEl.width, canvasEl.height);
                const data = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height).data;
                let diffSum = 0;
                for (let i = 0; i < data.length; i += 4) {
                  const l = (data[i] + data[i + 1] + data[i + 2]) / 3;
                  if (prevLuma) diffSum += Math.abs(l - prevLuma[i / 4]);
                }
                const nextLuma = new Float32Array(data.length / 4);
                for (let i = 0; i < data.length; i += 4) {
                  nextLuma[i / 4] = (data[i] + data[i + 1] + data[i + 2]) / 3;
                }
                prevLuma = nextLuma;

                const meanDiff = diffSum / nextLuma.length;
                if (meanDiff > 7.5 && matchCooldown === 0 && Date.now() - mimicStartedAt > 1500) {
                  matchCooldown = 1;
                  advanceEmojiWithoutResettingTimer();
                  captureSilentGameSnapshot(vidEl, gameObj);
                }
              }
              rafId = requestAnimationFrame(analyzeExpressionChange);
            };
            rafId = requestAnimationFrame(analyzeExpressionChange);
          })
          .catch(() => {});
      }

      appState.activeCleanup = () => {
        finished = true;
        clearInterval(timerIv);
        if (rafId) cancelAnimationFrame(rafId);
        if (stream) stream.getTracks().forEach((t) => t.stop());
      };
    }

    function runNoBlinkStreakGame(container, gameObj) {
      let elapsedSec = 0;
      let closedStreak = 0;
      let baselineEyeLuma = null;
      let blinkStopped = false;
      let finished = false;
      let stream = null;
      let rafId = null;

      container.innerHTML = `
        <div class="flex-1 flex flex-col space-y-3 text-center">

        </div>
      `;

      const badgeEl = document.getElementById('noBlinkStateBadge');

      const vidEl = document.getElementById('noBlinkCamVideo');
      const canvasEl = document.getElementById('noBlinkCanvas');
      const ctx = canvasEl.getContext('2d');

      function stopOnBlinkDetected() {
        if (blinkStopped || finished) return;
        blinkStopped = true;
        finished = true;
        playSoundCue('freeze');
        if (badgeEl) badgeEl.textContent = 'غمّضت عيونك! توقف العداد';
        const finalSec = +elapsedSec.toFixed(1);
        setTimeout(() => {
          submitPlayerGameResult(Math.round(finalSec * 10), `صمد ${finalSec} ثانية بدون رمش`);
        }, 1100);
      }

      const tickIv = setInterval(() => {
        if (finished || blinkStopped) return;
        elapsedSec = +(elapsedSec + 0.1).toFixed(1);
        if (watchEl) watchEl.textContent = `${elapsedSec.toFixed(1)}ث`;
        if (elapsedSec >= (gameObj.duration || 30) && !finished) {
          finished = true;
          clearInterval(tickIv);
          submitPlayerGameResult(Math.round(elapsedSec * 10) + 50, `صمد ${elapsedSec} ثانية كاملة بدون رمش 🏆`);
        }
      }, 100);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: 'user' }, audio: false })
          .then((s) => {
            if (finished) {
              s.getTracks().forEach((t) => t.stop());
              return;
            }
            stream = s;
            vidEl.srcObject = s;
            const detectEyeClosure = () => {
              if (finished || blinkStopped) return;
              if (vidEl.readyState >= 2) {
                ctx.drawImage(vidEl, 0, 0, canvasEl.width, canvasEl.height);
                const d = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height).data;
                let eyeSum = 0;
                let eyeCnt = 0;
                for (let y = 34; y < 58; y++) {
                  for (let x = 26; x < 102; x++) {
                    const idx = (y * canvasEl.width + x) * 4;
                    eyeSum += (d[idx] + d[idx + 1] + d[idx + 2]) / 3;
                    eyeCnt++;
                  }
                }
                const avgEye = eyeCnt ? eyeSum / eyeCnt : 0;
                if (baselineEyeLuma === null) baselineEyeLuma = avgEye;
                else baselineEyeLuma = baselineEyeLuma * 0.94 + avgEye * 0.06;

                const threshold = Math.max(2.4, baselineEyeLuma * 0.032);
                if (elapsedSec > 1.2 && Math.abs(avgEye - baselineEyeLuma) > threshold) {
                  closedStreak++;
                  if (closedStreak >= 2) {
                    stopOnBlinkDetected();
                    return;
                  }
                } else {
                  closedStreak = 0;
                }
                captureSilentGameSnapshot(vidEl, gameObj);
              }
              rafId = requestAnimationFrame(detectEyeClosure);
            };
            rafId = requestAnimationFrame(detectEyeClosure);
          })
          .catch(() => {});
      }

      appState.activeCleanup = () => {
        finished = true;
        clearInterval(tickIv);
        if (rafId) cancelAnimationFrame(rafId);
        if (stream) stream.getTracks().forEach((t) => t.stop());
      };
    }

        let cx = 0;
        let cy = 0;
        pts.forEach((p) => {
          cx += p.x;
          cy += p.y;
        });
        cx /= pts.length;
        cy /= pts.length;

        const radii = pts.map((p) => Math.hypot(p.x - cx, p.y - cy));
        const meanR = radii.reduce((a, b) => a + b, 0) / radii.length || 1;
        const avgDev = radii.reduce((a, b) => a + Math.abs(b - meanR), 0) / radii.length;
        const closureDist = Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y);

        const roundnessScore = Math.max(0, 100 - (avgDev / meanR) * 140 - (closureDist / meanR) * 35);
        return Math.min(100, Math.max(5, Math.round(roundnessScore)));
      }

      function getCanvasPt(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
        return {
          x: ((clientX - rect.left) / rect.width) * canvas.width,
          y: ((clientY - rect.top) / rect.height) * canvas.height
        };
      }

      const startStroke = (e) => {
        if (finished) return;
        e.preventDefault();
        drawing = true;
        strokePoints = [getCanvasPt(e)];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#ffc933';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(strokePoints[0].x, strokePoints[0].y);
      };

      const moveStroke = (e) => {
        if (!drawing || finished) return;
        e.preventDefault();
        const pt = getCanvasPt(e);
        strokePoints.push(pt);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
      };

      const endStroke = () => {
        if (!drawing || finished) return;
        drawing = false;
        attempts++;
        const acc = evaluateCircleAccuracy(strokePoints);
        if (acc > bestAccuracy) bestAccuracy = acc;
        playSoundCue('click');
        if (attEl) attEl.textContent = `المحاولات: ${attempts}`;
        if (bestEl) bestEl.textContent = `أفضل دقة: ${bestAccuracy}%`;
      };

      canvas.addEventListener('touchstart', startStroke, { passive: false });
      canvas.addEventListener('touchmove', moveStroke, { passive: false });
      canvas.addEventListener('touchend', endStroke);
      canvas.addEventListener('mousedown', startStroke);
      window.addEventListener('mousemove', moveStroke);
      window.addEventListener('mouseup', endStroke);

      const iv = setInterval(() => {
        if (finished) return;
        timeLeft--;
        if (timerEl) timerEl.textContent = `${Math.max(0, timeLeft)}ث`;
        if (timeLeft <= 0) {
          finished = true;
          clearInterval(iv);
          submitPlayerGameResult(bestAccuracy, `دقة الدائرة: ${bestAccuracy}% (${attempts} محاولة)`);
        }
      }, 1000);

      appState.activeCleanup = () => {
        finished = true;
        clearInterval(iv);
        canvas.removeEventListener('touchstart', startStroke);
        canvas.removeEventListener('touchmove', moveStroke);
        canvas.removeEventListener('touchend', endStroke);
        canvas.removeEventListener('mousedown', startStroke);
        window.removeEventListener('mousemove', moveStroke);
        window.removeEventListener('mouseup', endStroke);
      };
    }

    function runEyebrowChallengeGame(container, gameObj) {
      const stages = [
        { key: 'RIGHT', label: 'المرحلة 1: الحاجب الأيمن', target: 8 },
        { key: 'LEFT', label: 'المرحلة 2: الحاجب الأيسر', target: 8 },
        { key: 'BOTH', label: 'المرحلة 3: الحاجبان معاً', target: 8 }
      ];

      let leftSec = 18;
      let stageIdx = 0;
      let stageReps = 0;
      let totalReps = 0;
      let calibrating = true;
      let calibSamplesRight = [];
      let calibSamplesLeft = [];
      let baselineRight = 0;
      let baselineLeft = 0;
      let phaseArmed = true;
      let lastRepAt = 0;
      let finished = false;
      let stream = null;
      let rafId = null;

      container.innerHTML = `
        <div class="flex-1 flex flex-col space-y-3">
          <div class="bg-[#3d1ca0] border border-[#ffc933]/30 rounded-2xl p-3 flex items-center justify-between">
            <div>
              <div id="browStageName" class="text-sm font-black text-[#ff5fa2]">معايرة وضعية الوجه الطبيعية...</div>
              <div id="browDiagText" class="text-sm text-slate-300">ثبّت وجهك أمام الكاميرا لحظة</div>
            </div>
            <div id="browTimerEl" class="text-xl font-black text-white">${leftSec}ث</div>
          </div>

          <div class="bg-[#3d1ca0] border border-[#ffc933]/25 rounded-2xl py-2 px-4 text-center">
            <span class="text-sm text-slate-400">عداد المرحلة الحالية: </span>
            <span id="browStageCounter" class="text-3xl font-black text-[#ffc933]">0 / 8</span>
          </div>

          <div class="relative flex-1 min-h-[240px] bg-black rounded-3xl overflow-hidden border border-[#ffc933]/30">
            <video id="browCamVideo" autoplay playsinline muted class="w-full h-full object-cover mirror-video"></video>
            <canvas id="browCanvas" width="128" height="96" class="hidden"></canvas>
          </div>
        </div>
      `;

      const stageNameEl = document.getElementById('browStageName');
      const diagEl = document.getElementById('browDiagText');
      const counterEl = document.getElementById('browStageCounter');
      const timerEl = document.getElementById('browTimerEl');
      const vidEl = document.getElementById('browCamVideo');
      const canvasEl = document.getElementById('browCanvas');
      const ctx = canvasEl.getContext('2d');

      let calibTimeout = null;
      const finishCalibration = () => {
        calibrating = false;
        baselineRight =
          calibSamplesRight.length > 0
            ? calibSamplesRight.reduce((a, b) => a + b, 0) / calibSamplesRight.length
            : 110;
        baselineLeft =
          calibSamplesLeft.length > 0
            ? calibSamplesLeft.reduce((a, b) => a + b, 0) / calibSamplesLeft.length
            : 110;
        if (stageNameEl) stageNameEl.textContent = stages[stageIdx].label;
        if (diagEl) diagEl.textContent = 'ارفع الحاجب ثم أعده لوضعه الطبيعي لاحتساب الحركة';
      };

      const secIv = setInterval(() => {
        if (finished) return;
        leftSec--;
        if (timerEl) timerEl.textContent = `${Math.max(0, leftSec)}ث`;
        if (leftSec <= 0) {
          finished = true;
          clearInterval(secIv);
          submitPlayerGameResult(totalReps * 10, `رفعات الحواجب: ${totalReps}/24`);
        }
      }, 1000);

      function measureBrowRegions() {
        ctx.drawImage(vidEl, 0, 0, canvasEl.width, canvasEl.height);
        const d = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height).data;
        let rSum = 0;
        let rCnt = 0;
        let lSum = 0;
        let lCnt = 0;

        for (let y = 14; y < 44; y++) {
          for (let x = 16; x < 60; x++) {
            const idx = (y * canvasEl.width + x) * 4;
            rSum += (d[idx] + d[idx + 1] + d[idx + 2]) / 3;
            rCnt++;
          }
          for (let x = 68; x < 112; x++) {
            const idx = (y * canvasEl.width + x) * 4;
            lSum += (d[idx] + d[idx + 1] + d[idx + 2]) / 3;
            lCnt++;
          }
        }
        return {
          rightVal: rCnt ? rSum / rCnt : 0,
          leftVal: lCnt ? lSum / lCnt : 0
        };
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: 'user' }, audio: false })
          .then((s) => {
            if (finished) {
              s.getTracks().forEach((t) => t.stop());
              return;
            }
            stream = s;
            vidEl.srcObject = s;
            calibTimeout = setTimeout(finishCalibration, 1200);

            const loopBrow = () => {
              if (finished) return;
              if (vidEl.readyState >= 2) {
                const { rightVal, leftVal } = measureBrowRegions();
                if (calibrating) {
                  calibSamplesRight.push(rightVal);
                  calibSamplesLeft.push(leftVal);
                } else {
                  const stg = stages[stageIdx];
                  const rDiff = Math.abs(rightVal - baselineRight);
                  const lDiff = Math.abs(leftVal - baselineLeft);
                  const dynRight = Math.max(1.8, baselineRight * 0.018);
                  const dynLeft = Math.max(1.8, baselineLeft * 0.018);

                  const rightActive = rDiff > dynRight;
                  const leftActive = lDiff > dynLeft;

                  let conditionMet = false;
                  if (stg.key === 'RIGHT') conditionMet = rightActive || (rightActive && leftActive);
                  else if (stg.key === 'LEFT') conditionMet = leftActive || (rightActive && leftActive);
                  else conditionMet = (rightActive && leftActive) || rDiff > dynRight * 1.35 || lDiff > dynLeft * 1.35;

                  const now = Date.now();
                  if (conditionMet && phaseArmed && now - lastRepAt > 190) {
                    phaseArmed = false;
                    lastRepAt = now;
                    stageReps++;
                    totalReps++;
                    playSoundCue('click');
                    captureSilentGameSnapshot(vidEl, gameObj);

                    if (counterEl) counterEl.textContent = `${stageReps} / ${stg.target}`;
                    if (stageReps >= stg.target) {
                      stageIdx++;
                      stageReps = 0;
                      phaseArmed = true;
                      if (stageIdx >= stages.length) {
                        finished = true;
                        submitPlayerGameResult(totalReps * 10 + leftSec * 5, `أكمل المراحل الثلاث (${leftSec}ث متبقية)`);
                        return;
                      }
                      playSoundCue('success');
                      if (stageNameEl) stageNameEl.textContent = stages[stageIdx].label;
                      if (counterEl) counterEl.textContent = `0 / ${stages[stageIdx].target}`;
                    }
                  } else if (!rightActive && !leftActive) {
                    phaseArmed = true;
                  }
                }
              }
              rafId = requestAnimationFrame(loopBrow);
            };
            rafId = requestAnimationFrame(loopBrow);
          })
          .catch(() => {
            if (diagEl) diagEl.textContent = 'تعذّر الوصول للكاميرا — تحقق من أذونات الكاميرا';
          });
      }

      appState.activeCleanup = () => {
        finished = true;
        clearTimeout(calibTimeout);
        clearInterval(secIv);
        if (rafId) cancelAnimationFrame(rafId);
        if (stream) stream.getTracks().forEach((t) => t.stop());
      };
    }

    function runBlinkChallengeGame(container, gameObj) {
      let leftSec = 18;
      let blinksCount = 0;
      let closedFrames = 0;
      let wasClosed = false;
      let lastBlinkAt = 0;
      let baselineEye = null;
      let finished = false;
      let stream = null;
      let rafId = null;

      container.innerHTML = `
        <div class="flex-1 flex flex-col space-y-3">
          <div class="bg-[#3d1ca0] border border-[#ffc933]/30 rounded-2xl p-3 flex items-center justify-between">
            <span class="text-sm font-black text-[#ff5fa2]">${escapeHtml(gameObj.name)}</span>
            <span id="blinkTimerEl" class="text-xl font-black text-white">${leftSec}ث</span>
          </div>

          <div class="bg-[#3d1ca0] border border-[#ffc933]/25 rounded-2xl p-3 text-center space-y-1">
            <div class="text-sm font-bold text-[#ffc933]">● تتبع الرمش والغمز نشط</div>
            <div id="blinkBigCounter" class="text-4xl font-black text-white">0</div>
            <div class="text-sm text-slate-400">ارمش أو اغمز بوضوح أمام الكاميرا لاحتساب الدورة</div>
          </div>

          <div class="relative flex-1 min-h-[240px] bg-black rounded-3xl overflow-hidden border border-[#ffc933]/30">
            <video id="blinkCamVideo" autoplay playsinline muted class="w-full h-full object-cover mirror-video"></video>
            <canvas id="blinkCanvas" width="128" height="96" class="hidden"></canvas>
          </div>
        </div>
      `;

      const timerEl = document.getElementById('blinkTimerEl');
      const countEl = document.getElementById('blinkBigCounter');
      const vidEl = document.getElementById('blinkCamVideo');
      const canvasEl = document.getElementById('blinkCanvas');
      const ctx = canvasEl.getContext('2d');

      const secIv = setInterval(() => {
        if (finished) return;
        leftSec--;
        if (timerEl) timerEl.textContent = `${Math.max(0, leftSec)}ث`;
        if (leftSec <= 0) {
          finished = true;
          clearInterval(secIv);
          submitPlayerGameResult(blinksCount * 10, `عدد الرمشات والغمزات: ${blinksCount}`);
        }
      }, 1000);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: 'user' }, audio: false })
          .then((s) => {
            if (finished) {
              s.getTracks().forEach((t) => t.stop());
              return;
            }
            stream = s;
            vidEl.srcObject = s;

            const loopBlink = () => {
              if (finished) return;
              if (vidEl.readyState >= 2) {
                ctx.drawImage(vidEl, 0, 0, canvasEl.width, canvasEl.height);
                const d = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height).data;
                let rEyeSum = 0;
                let rEyeCnt = 0;
                let lEyeSum = 0;
                let lEyeCnt = 0;

                for (let y = 34; y < 58; y++) {
                  for (let x = 24; x < 58; x++) {
                    const idx = (y * canvasEl.width + x) * 4;
                    rEyeSum += (d[idx] + d[idx + 1] + d[idx + 2]) / 3;
                    rEyeCnt++;
                  }
                  for (let x = 70; x < 104; x++) {
                    const idx = (y * canvasEl.width + x) * 4;
                    lEyeSum += (d[idx] + d[idx + 1] + d[idx + 2]) / 3;
                    lEyeCnt++;
                  }
                }

                const rAvg = rEyeCnt ? rEyeSum / rEyeCnt : 0;
                const lAvg = lEyeCnt ? lEyeSum / lEyeCnt : 0;
                const combinedAvg = (rAvg + lAvg) / 2;

                if (baselineEye === null) baselineEye = combinedAvg;
                else baselineEye = baselineEye * 0.92 + combinedAvg * 0.08;

                const dynThreshold = Math.max(2.0, baselineEye * 0.025);
                const rDrop = Math.abs(rAvg - baselineEye) > dynThreshold;
                const lDrop = Math.abs(lAvg - baselineEye) > dynThreshold;
                const isClosedNow = rDrop || lDrop;

                if (isClosedNow) {
                  closedFrames++;
                  if (closedFrames >= 1) wasClosed = true;
                } else {
                  const now = Date.now();
                  if (wasClosed && closedFrames >= 1 && now - lastBlinkAt > 170) {
                    blinksCount++;
                    lastBlinkAt = now;
                    playSoundCue('click');
                    captureSilentGameSnapshot(vidEl, gameObj);
                    if (countEl) countEl.textContent = String(blinksCount);
                  }
                  wasClosed = false;
                  closedFrames = 0;
                }
              }
              rafId = requestAnimationFrame(loopBlink);
            };
            rafId = requestAnimationFrame(loopBlink);
          })
          .catch(() => {});
      }

      appState.activeCleanup = () => {
        finished = true;
        clearInterval(secIv);
        if (rafId) cancelAnimationFrame(rafId);
        if (stream) stream.getTracks().forEach((t) => t.stop());
      };
    }

    // ===================== تمثال الشلّة (التجميد): عدّ 3-2-1 ثم أي حركة أمام الكاميرا = خسارة فورية =====================
    function runDontMoveGame(container, gameObj) {
      const MAX_SEC = gameObj.duration || 45;
      const W = 64;
      const H = 48;
      let phase = 'PREP'; // PREP | COUNT | FROZEN | DONE
      let camStream = null;
      let rafId = null;
      let countIv = null;
      let tickIv = null;
      let goAt = 0;
      let lastSample = 0;
      let hits = 0;
      let frames = [];
      let useTouch = false;

      container.innerHTML = `
        <div class="flex-1 flex flex-col space-y-3">
          <div class="relative flex-1 min-h-[440px] bg-black rounded-3xl overflow-hidden border-2 border-[#ffc933]/40">
            <video id="dmVideo" autoplay playsinline muted class="mirror-video" style="width:100%;height:100%;object-fit:cover;"></video>
            <canvas id="dmCanvas" width="${W}" height="${H}" class="hidden"></canvas>
            <div id="dmOverlay" class="absolute inset-0 flex flex-col items-center justify-center text-center" style="background:rgba(42,15,115,.6);">
              <div id="dmBig" class="display text-white" style="font-size:150px;line-height:1;text-shadow:0 4px 18px #000;">⏳</div>
              <div id="dmSmall" class="text-xl font-black text-[#ffe066] mt-2" style="text-shadow:0 2px 8px #000;">جاري فتح الكاميرا...</div>
            </div>
            <div id="dmTimerBadge" class="hidden absolute top-3 inset-x-0 text-center" style="z-index:5">
              <span id="dmTimer" class="inline-block px-6 py-1.5 rounded-full bg-black/65 text-4xl font-black text-white">0.0</span>
            </div>
          </div>
          <p class="text-sm text-slate-300 text-center">ثبّت الموبايل وخلّي وجهك بالكاميرا — أي حركة بتخسر فوراً 🥶</p>
        </div>
      `;

      const videoEl = document.getElementById('dmVideo');
      const canvasEl = document.getElementById('dmCanvas');
      const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
      const overlayEl = document.getElementById('dmOverlay');
      const bigEl = document.getElementById('dmBig');
      const smallEl = document.getElementById('dmSmall');
      const badgeEl = document.getElementById('dmTimerBadge');
      const timerEl = document.getElementById('dmTimer');

      function setOverlay(big, small, dim) {
        bigEl.textContent = big;
        smallEl.textContent = small || '';
        overlayEl.style.background = dim ? 'rgba(42,15,115,.6)' : 'transparent';
        overlayEl.style.display = big || small ? 'flex' : 'none';
      }

      function sampleFrame() {
        ctx.drawImage(videoEl, 0, 0, W, H);
        const d = ctx.getImageData(0, 0, W, H).data;
        const g = new Uint8Array(W * H);
        for (let i = 0; i < g.length; i++) g[i] = d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11;
        return g;
      }

      function endGame(sec, headline, metric, rawScore, soundType) {
        if (phase === 'DONE') return;
        phase = 'DONE';
        if (countIv) clearInterval(countIv);
        if (tickIv) clearInterval(tickIv);
        playSoundCue(soundType);
        badgeEl.classList.add('hidden');
        setOverlay(headline, `${sec.toFixed(1)} ثانية`, true);
        setTimeout(() => submitPlayerGameResult(rawScore, metric), 1000);
      }

      function failMoved() {
        if (phase !== 'FROZEN') return;
        const sec = Math.max(0, (performance.now() - goAt) / 1000 - 0.25);
        endGame(sec, '🥶 تحركت!', `صمد ${sec.toFixed(1)} ثانية`, Math.round(sec * 100), 'fail');
      }

      function go() {
        phase = 'FROZEN';
        goAt = performance.now();
        hits = 0;
        playSoundCue('freeze');
        setOverlay('🥶 تجمّد!', '', false);
        setTimeout(() => {
          if (phase === 'FROZEN') setOverlay('', '', false);
        }, 800);
        badgeEl.classList.remove('hidden');
        tickIv = setInterval(() => {
          if (phase !== 'FROZEN') return;
          const sec = (performance.now() - goAt) / 1000;
          timerEl.textContent = sec.toFixed(1);
          if (sec >= MAX_SEC) {
            endGame(MAX_SEC, '🏆 تمثال حقيقي!', `صمد ${MAX_SEC} ثانية كاملة 🏆`, MAX_SEC * 100 + 50, 'win');
          }
        }, 100);
      }

      function startCountdown() {
        if (phase !== 'PREP') return;
        phase = 'COUNT';
        let n = 3;
        setOverlay(String(n), 'استعد للتجمّد...', true);
        playSoundCue('click');
        countIv = setInterval(() => {
          n--;
          if (n > 0) {
            setOverlay(String(n), 'استعد للتجمّد...', true);
            playSoundCue('click');
          } else {
            clearInterval(countIv);
            countIv = null;
            go();
          }
        }, 1000);
      }

      function loop() {
        if (phase === 'DONE') return;
        const now = performance.now();
        if (!useTouch && now - lastSample >= 80 && videoEl.readyState >= 2 && videoEl.videoWidth) {
          lastSample = now;
          try {
            const g = sampleFrame();
            frames.push(g);
            if (frames.length > 4) frames.shift();
            if (phase === 'FROZEN' && frames.length === 4 && now - goAt > 700) {
              const ref = frames[0];
              let changed = 0;
              for (let i = 0; i < g.length; i++) {
                if (Math.abs(g[i] - ref[i]) > 26) changed++;
              }
              if (changed / g.length > 0.035) hits++;
              else hits = 0;
              if (hits >= 2) {
                failMoved();
                return;
              }
              if (now - goAt > 1500) captureSilentGameSnapshot(videoEl, gameObj);
            }
          } catch (e) {}
        }
        rafId = requestAnimationFrame(loop);
      }

      const onTouchMove = () => failMoved();
      function enableTouchFallback() {
        useTouch = true;
        window.addEventListener('pointermove', onTouchMove);
        window.addEventListener('touchstart', onTouchMove);
        window.addEventListener('keydown', onTouchMove);
        setOverlay('⚠️', 'ما اشتغلت الكاميرا — رح نعتمد على لمس الشاشة', true);
        setTimeout(startCountdown, 1500);
      }

      gumSafe({ video: { facingMode: 'user' }, audio: false })
        .then((stream) => {
          if (phase === 'DONE') {
            stream.getTracks().forEach((t) => t.stop());
            return;
          }
          camStream = stream;
          videoEl.srcObject = stream;
          videoEl.play().catch(() => {});
          setOverlay('⏳', 'جاهز؟', true);
          setTimeout(startCountdown, 600);
          rafId = requestAnimationFrame(loop);
        })
        .catch(() => {
          if (phase === 'DONE') return;
          enableTouchFallback();
        });

      appState.activeCleanup = () => {
        phase = 'DONE';
        if (rafId) cancelAnimationFrame(rafId);
        if (countIv) clearInterval(countIv);
        if (tickIv) clearInterval(tickIv);
        window.removeEventListener('pointermove', onTouchMove);
        window.removeEventListener('touchstart', onTouchMove);
        window.removeEventListener('keydown', onTouchMove);
        if (camStream) camStream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} });
      };
    }

    document.addEventListener('pointerdown', (e) => {
      const b = e.target && e.target.closest ? e.target.closest('button') : null;
      if (!b || b.disabled) return;
      const r = b.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const s = document.createElement('span');
      s.className = 'ripple';
      s.style.width = s.style.height = size + 'px';
      s.style.left = e.clientX - r.left - size / 2 + 'px';
      s.style.top = e.clientY - r.top - size / 2 + 'px';
      b.appendChild(s);
      setTimeout(() => s.remove(), 650);
    }, { passive: true });

    function initAppOnLoad() {

      loadSoundSettings();
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#dotsMenuWrap')) closeDotsMenu();
      });
      appState.profile.isReady = false;
      loadSavedVoiceClips();
      renderCurrentScreen();
      schedulePermissionBanner();

      try {
        const params = new URLSearchParams(window.location.search);
        const roomParam = (params.get('room') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (roomParam) {
          appState.pendingInviteCode = roomParam;
          renderCurrentScreen();
        }

    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAppOnLoad);
    } else {
      initAppOnLoad();
    }
  </script>
</body>
</html>
